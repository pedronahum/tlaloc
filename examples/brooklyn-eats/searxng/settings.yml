# SearXNG settings for the web_search tool: JSON output on, rate limiter off (one local client).
use_default_settings: true
general:
  instance_name: brooklyn-eats
server:
  # Overridden at container start by SEARXNG_SECRET (searxng.sh).
  secret_key: "change-me"
  limiter: false
  image_proxy: false
  public_instance: false
search:
  safe_search: 1
  formats:
    - html
    - json
outgoing:
  request_timeout: 5.0
  max_request_timeout: 10.0
