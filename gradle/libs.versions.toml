[versions]
kotlin = "2.3.20"
kotlinx-coroutines = "1.11.0"
kotest = "5.9.1"
# Stage B coarsening — symbolic engine. LGPL-3.0 (not Apache-2.0 as docs/STAGE_B_PLAN.md
# §10.2 originally claimed; corrected in §0.4.13). LGPL allows linking from non-LGPL
# code, so Tlaloc's eventual Apache-2.0 license is unaffected — but modifications to
# matheclipse-core itself would be LGPL, so we treat Symja as a strict runtime
# dependency, never a fork-and-patch surface.
symja = "3.2.0"
# §0.4.498 — API docs. Dokka is the tooling item DIFFKTX_SPEC.md §14 listed and
# nobody wired; Maven Central additionally *requires* a -javadoc.jar per
# artifact. NOTE the constraint that decided the output format: Dokka's Javadoc
# format "doesn't support multi-project builds or Kotlin Multiplatform projects"
# (kotlinlang.org/docs/dokka-javadoc.html), and ten of Tlaloc's eleven published
# modules are KMP. So the javadoc jar carries Dokka HTML — which Central accepts
# (it checks that the classifier exists, not what is inside it) and which is what
# every KMP library on Central ships. Recorded in docs/ALPHA_PLAN.md, not implied.
dokka = "2.2.0"
# §0.4.505 (Tier 4, item 5) — binary-compatibility-validator. Before it, nothing in
# this repository could tell an intentional API change from an accidental one:
# `docs/COMPATIBILITY.md` promises five things will not break inside 0.1.x and
# there was no gate behind the promise. `./gradlew apiCheck` (wired into `check`,
# so `./gradlew test` covers it) diffs every published module's ABI against the
# committed `api/<module>.api` baseline; `./gradlew apiDump` re-baselines it, which
# is the deliberate act that makes a breaking change a reviewed diff.
binaryCompatibilityValidator = "0.18.2"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotest-assertions-core = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
kotest-property = { module = "io.kotest:kotest-property", version.ref = "kotest" }
kotest-runner-junit5 = { module = "io.kotest:kotest-runner-junit5", version.ref = "kotest" }
kotlin-compiler-embeddable = { module = "org.jetbrains.kotlin:kotlin-compiler-embeddable", version.ref = "kotlin" }
symja-core = { module = "org.matheclipse:matheclipse-core", version.ref = "symja" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
binary-compatibility-validator = { id = "org.jetbrains.kotlinx.binary-compatibility-validator", version.ref = "binaryCompatibilityValidator" }
