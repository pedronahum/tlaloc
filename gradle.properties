org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
kotlin.code.style=official

# §0.4.503 — the JVM target split (root build.gradle.kts, `tlalocJvmTargets`) made
# "runs on a JDK 21" a claim this repository has to be able to TEST, which needs a
# JDK 21 present. Gradle's auto-detection does not look in `~/.local/jdks`, and a
# literal path here would be one developer's machine baked into a committed file —
# the same defect §0.4.503 item 4 removes from PjrtBinaries. So the location comes
# from an environment variable instead:
#
#   export JDK21_HOME=$HOME/.local/jdks/jdk-21.0.2
#
# Nothing in `./gradlew test` needs it. It is needed by `scripts/jdk21-smoke.sh`
# and by `./gradlew :maestro:exportServingArtifact -PexportJdk=21`, and both say so
# by name when it is missing.
org.gradle.java.installations.fromEnv=JDK21_HOME
