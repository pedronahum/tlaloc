version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    # third-party/maestro is vendored at a pinned upstream commit and is upgraded
    # only by the procedure in docs/vendoring.md.
    exclude-paths:
      - "third-party/**"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      # gradle/actions v6 moves its caching into a proprietary component whose
      # Terms of Use a workflow accepts by upgrading. Staying on v5 (MIT) until
      # the maintainer decides whether to accept them.
      - dependency-name: "gradle/actions"
        versions: [">= 6"]
