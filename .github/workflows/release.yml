# Release to Maven Central. Runs only for a pushed tag v<version> (or a manual
# run started on such a tag), never for ordinary pushes or pull requests.
#
# It runs the suite, uploads every signed publication to the OSSRH Staging API,
# and hands the upload to the Central Portal with publishing_type=user_managed:
# the deployment then waits at https://central.sonatype.com/publishing/deployments
# until someone presses Publish. docs/RELEASING.md has the full procedure.
#
# Repository secrets it needs:
#   SIGNING_IN_MEMORY_KEY           ASCII-armoured private key
#   SIGNING_IN_MEMORY_KEY_PASSWORD  its passphrase
#   CENTRAL_USERNAME                Central Portal user-token username
#   CENTRAL_PASSWORD                Central Portal user-token password
# A missing one fails the upload step by name before anything is sent.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: publish ${{ github.ref_name }} to Maven Central
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Tag matches the project version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" != "tag" ]; then
            echo "::error::release runs on a tag; this run is on $REF_TYPE '$REF_NAME'. Start it on a v<version> tag."
            exit 1
          fi
          version=$(./gradlew -q properties --no-daemon | awk '/^version:/ {print $2}')
          if [ -z "$version" ]; then
            echo "::error::could not read the project version from Gradle."
            exit 1
          fi
          if [ "$REF_NAME" != "v$version" ]; then
            echo "::error::tag '$REF_NAME' does not match the project version '$version' (expected tag 'v$version')."
            exit 1
          fi
          case "$version" in
            *SNAPSHOT) echo "::error::$version is a SNAPSHOT; Central releases need a fixed version."; exit 1 ;;
          esac
          echo "Releasing $version"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      # A version released from a workstation, then tagged, must not be uploaded a
      # second time.
      - name: Version is not on Central yet
        run: |
          pom="https://repo1.maven.org/maven2/io/github/pedronahum/tlaloc-core/$VERSION/tlaloc-core-$VERSION.pom"
          status=$(curl -s -o /dev/null -w '%{http_code}' "$pom")
          if [ "$status" = "200" ]; then
            echo "::error::$VERSION is already on Maven Central ($pom). Nothing to upload."
            exit 1
          fi
          if [ "$status" != "404" ]; then
            echo "::error::could not tell whether $VERSION is on Maven Central: HTTP $status for $pom."
            exit 1
          fi

      - name: Test
        run: ./gradlew test --no-daemon --stacktrace

      # Publishes to mavenLocal and builds consumers from it: the Gradle plugin's
      # options and refusals, and the build files printed in the README and
      # GETTING_STARTED, verbatim.
      - name: Onboarding smoke
        run: bash scripts/onboarding-smoke.sh

      # --no-parallel keeps every module's upload in one sequence from this
      # runner's IP address, which the Portal handoff at the end must share.
      - name: Upload to Central staging and hand off to the Portal
        env:
          SIGNING_IN_MEMORY_KEY: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          SIGNING_IN_MEMORY_KEY_PASSWORD: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
        run: ./gradlew releaseToCentralPortal --no-daemon --no-parallel --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 14
          if-no-files-found: warn
