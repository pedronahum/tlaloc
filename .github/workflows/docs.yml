# The documentation site (mkdocs.yml): built on every change to the docs, failing on any
# warning (a broken link or anchor, a page missing from the nav). On main (a push or a
# run started by hand), when the repository variable DOCS_PAGES is "true", it is also
# deployed to GitHub Pages (Settings > Pages > Source: GitHub Actions).
name: docs

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "docs/**"
      - "examples/**/README.md"
      - "examples/README.md"
      - "CHANGELOG.md"
      - "mkdocs.yml"
      - "scripts/mkdocs_hooks.py"
      - "scripts/test_mkdocs_hooks.py"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install the site's tools
        run: pip install -r docs/requirements.txt
      - name: Test the hooks
        run: python3 scripts/test_mkdocs_hooks.py
      - name: Build the site
        env:
          NO_MKDOCS_2_WARNING: "1"
        run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: build/site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DOCS_PAGES == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
