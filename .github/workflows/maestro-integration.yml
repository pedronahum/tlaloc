# OQ-Layer2.5-9 — the CI lane specified by §0.4.249 (L2.5.5) and recorded in
# docs/audits/maestro_first_class_audit.md §1 "CI integration".
#
# The file was designed in that slice but never landed: its push was rejected
# because the auth token lacked `workflow` scope. This is that file, with the
# one change the intervening year forced — the toolchain is JDK 25, not the
# JDK 21 the original design named (the repo moved in §0.4.311).
#
# What it does NOT do, deliberately, per the audit:
#   - build the runtime container image (Docker-in-Docker; OQ-Layer2.5-3)
#   - boot a live Maestro with K8s pod lifecycle (kind/k3d; OQ-Layer2.5-3)
# v1 runs the maestro-tlaloc suite, which exercises the same code path with
# synthetic inputs.
#
# §0.4.504 made three changes and left everything else alone:
#
#   1. IT NOW RUNS ON PULL REQUESTS. It was `push`-only, so a PR that renamed
#      Maestro's StepType registry — the exact event the paths filter exists to
#      catch — merged unchecked and only went red afterwards, on main.
#   2. THE FULL TLALOC SUITE STEP IS GONE, replaced by `:maestro:jvmTest`. When
#      this file landed (§0.4.497) the repo-wide lane was one ubuntu job; the
#      suite step here was the only thing covering Tlaloc on a matching push.
#      build.yml now runs `./gradlew test` on x86_64 Linux AND arm64 macOS on
#      these same events, so running it a third time here bought nothing and cost
#      the lane its 10-minute budget. What is left is the part this lane is FOR:
#      the Tlaloc side of the handoff, plus the vendored-Maestro side.
#   3. Every path in the filter below was checked to still exist (§0.4.504); a
#      stale path in a paths filter is a lane that silently never triggers.
#
# The `:vendored-maestro:maestro-tlaloc:test` step was run locally on 2026-09-22
# and is green (26 tasks, 4 executed). The LANE, as a GitHub workflow, has never
# run — docs/ALPHA_PLAN.md marks it 🧪.
name: maestro-integration

on:
  workflow_dispatch:
  push:
    paths:
      # The vendored step type, its entrypoint builder and its tests.
      - 'third-party/maestro/maestro-tlaloc/**'
      # Maestro's own StepType registry — a rename there breaks our registration.
      - 'third-party/maestro/maestro-common/src/main/java/com/netflix/maestro/models/definition/StepType.java'
      # The server that wires the step type in, and the vendored build's own
      # configuration (tool versions, Checkstyle and PMD rules).
      - 'third-party/maestro/maestro-server/**'
      - 'third-party/maestro/build.gradle'
      - 'third-party/maestro/settings.gradle'
      - 'third-party/maestro/config/**'
      # The Tlaloc side of the handoff: the typed handle that crosses a step.
      - 'maestro/src/jvmMain/kotlin/io/tlaloc/maestro/SerializedBufferHandle.kt'
      - 'maestro/src/jvmTest/kotlin/io/tlaloc/maestro/SerializedBufferHandleTest.kt'
      - 'maestro/src/**/serving/**'
      # And this file.
      - '.github/workflows/maestro-integration.yml'
  # The same list, duplicated because GitHub Actions does not support YAML
  # anchors in workflow files and a `paths` filter cannot be shared between two
  # events. Keep the two lists in step.
  pull_request:
    paths:
      - 'third-party/maestro/maestro-tlaloc/**'
      - 'third-party/maestro/maestro-common/src/main/java/com/netflix/maestro/models/definition/StepType.java'
      - 'third-party/maestro/maestro-server/**'
      - 'third-party/maestro/build.gradle'
      - 'third-party/maestro/settings.gradle'
      - 'third-party/maestro/config/**'
      - 'maestro/src/jvmMain/kotlin/io/tlaloc/maestro/SerializedBufferHandle.kt'
      - 'maestro/src/jvmTest/kotlin/io/tlaloc/maestro/SerializedBufferHandleTest.kt'
      - 'maestro/src/**/serving/**'
      - '.github/workflows/maestro-integration.yml'

concurrency:
  group: maestro-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-latest
    # The audit's budget is 10 minutes; the composite Gradle build is the long
    # pole (~5-7 min cold, ~1 min warm). 25 is headroom, not an expectation.
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      # The Tlaloc side of the handoff. Hardware-gated tests (PJRT, CUDA, IREE,
      # KPTX) check PjrtBinaries.available / cudaAvailable and self-skip by name
      # on a runner that has none of them, and the serving lanes' Python oracle
      # skips with no venv at ~/.local/venvs/iree — so this is the
      # platform-neutral part of :maestro, which is what this lane is for. The
      # whole repository's suite is build.yml's job, on both platforms.
      - name: Tlaloc :maestro test suite
        run: ./gradlew :maestro:jvmTest --no-daemon --stacktrace

      # The vendored Maestro side, through the composite build. This is the
      # step the lane exists for: it fails if our step type stops registering
      # against the Maestro we vendor.
      - name: maestro-tlaloc test suite
        run: ./gradlew :vendored-maestro:maestro-tlaloc:test --no-daemon --stacktrace

      # Every vendored module compiles, including maestro-server, which registers
      # the step type, and passes the vendored build's Spotless, Checkstyle and
      # PMD checks on JDK 25. Then maestro-server's tests, which include the one
      # that checks the Tlaloc step runtime is registered under TLALOC.
      - name: vendored Maestro compile and lint
        run: ./gradlew -p third-party/maestro build -x test --no-daemon --stacktrace

      - name: maestro-server test suite
        run: ./gradlew :vendored-maestro:maestro-server:test --no-daemon --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maestro-integration-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 14
          if-no-files-found: warn
