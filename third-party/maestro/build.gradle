// Modified by Pedro N. Rodriguez for Tlaloc, 2026: JDK 25 toolchain, JUnit Platform launcher on the
// test classpath, Spotless 8 / google-java-format 1.30.0, Checkstyle pinned to 9.3.
// See docs/vendoring.md in the Tlaloc repository.

buildscript {
    repositories {
        mavenCentral()
        maven {
            url "https://plugins.gradle.org/m2/"
        }
    }
    dependencies {
        classpath 'com.diffplug.spotless:spotless-plugin-gradle:8.10.2'
        classpath "com.github.spotbugs.snom:spotbugs-gradle-plugin:6.+"
    }
}

apply from: "${rootDir}/dependencies.gradle"

allprojects {
    apply plugin: 'java'
    apply plugin: 'jacoco'
    apply plugin: 'com.diffplug.spotless'

    repositories {
        mavenCentral()
        maven {
            url "https://plugins.gradle.org/m2/"
        }
    }

    // Spotless 6 with google-java-format 1.19.2 cannot run on JDK 25: Spotless 6 resolves the
    // formatter while configuring the task, which Gradle 9 refuses inside a composite build, and
    // google-java-format below 1.30.0 refuses JVM 25. 1.30.0 indents a comment that follows a
    // switch case differently from 1.19.2; the three upstream files that have one keep their
    // upstream formatting and are excluded rather than reformatted.
    spotless {
        java {
            googleJavaFormat('1.30.0')
            removeUnusedImports() // removes any unused imports
            targetExclude(
                '**/com/netflix/maestro/engine/listeners/MaestroFinalFlowStatusCallback.java',
                '**/com/netflix/maestro/engine/steps/ForeachStepRuntime.java',
                '**/com/netflix/maestro/engine/tasks/MaestroTask.java')
        }
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }

    // §0.4.311 — `-Djava.security.manager=allow` was removed: Security Manager
    // is no longer supported on JDK 25 (JEP 486 finalised removal). Upstream
    // Netflix/maestro still ships the flag for older JDKs; the vendored fork
    // drops it for the JDK 25 unification.

    configurations.configureEach {
        resolutionStrategy {
        }
    }

    configurations {
        compileClasspath {
            resolutionStrategy.activateDependencyLocking()
        }
        runtimeClasspath {
            resolutionStrategy.activateDependencyLocking()
        }
        annotationProcessor {
            resolutionStrategy.activateDependencyLocking()
        }
    }
}

configure(allprojects - project(':netflix-sel')) {
    apply plugin: 'checkstyle'
    apply plugin: 'pmd'
    apply plugin: 'com.github.spotbugs'

    checkstyle {
        // Checkstyle 9.3 is the version Gradle 8.8 (upstream's wrapper) defaults to. Gradle 9
        // defaults to 10.x, which rejects the `scope` property config/checkstyle/checkstyle.xml sets.
        toolVersion = "9.3"
        checkstyleMain.enabled = true
        checkstyleMain.source = fileTree("src/main/java")
        checkstyleTest.enabled = false
    }

    pmd {
        toolVersion = "7.16.0"
        pmdTest.enabled = false
        consoleOutput = true
        rulesMinimumPriority = 5
        ruleSetFiles = files("${rootDir}/config/pmd/ruleset.xml")
        ruleSets = []
    }

    spotbugs {
        ignoreFailures = true
    }

    group = 'com.netflix.maestro'

    // Print out full stack traces when our tests fail to assist debugging (e.g., when scanning Jenkins console output)
    tasks.withType(Test).configureEach {
        useJUnitPlatform()
        testLogging {
            exceptionFormat = 'full'
        }
    }

    dependencies {
        compileOnly lombokDep
        annotationProcessor lombokDep

        testCompileOnly lombokDep
        testAnnotationProcessor lombokDep

        // §0.4.311 — Gradle 9.x removed implicit junit-platform-launcher
        // provisioning; tests using `useJUnitPlatform()` must now bring
        // their own launcher onto the test runtime classpath. The vintage
        // engine bridges JUnit 4 (`junitDep`) onto the JUnit Platform
        // launcher Gradle's test executor expects.
        testRuntimeOnly junitEngineDep
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }
}

configure(allprojects - project(':maestro-server')) {
    apply plugin: 'java-library'
}

configure([project(':maestro-common'), project(':maestro-engine'), project(':maestro-database')]) {
    apply plugin: 'java-test-fixtures'

    checkstyle {
        checkstyleTestFixtures.enabled = true
    }

    pmd {
        pmdTestFixtures.enabled = true
    }
}
